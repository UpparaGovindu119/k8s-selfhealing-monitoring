name: FastAPI EKS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-selfheal:latest

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update Kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.CLUSTER_NAME }}

    - name: Deploy to Kubernetes Cluster with Development Environment
      env:
        ENVIRONMENT: development
      run: |
        echo "Deploying application in $ENVIRONMENT mode..."
        kubectl set env deployment/fastapi-enterprise-deployment ENVIRONMENT=development -n production-app
        kubectl set image deployment/fastapi-enterprise-deployment fastapi=${{ secrets.DOCKER_USERNAME }}/fastapi-selfheal:latest -n production-app
        kubectl rollout status deployment/fastapi-enterprise-deployment -n production-app
EOF
